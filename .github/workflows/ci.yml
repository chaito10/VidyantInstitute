name: CI
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          pip install uv || true
          uv sync || pip install -e . || true
      - name: Compile check
        run: python -m compileall src main.py scripts
      - name: Validate sample course (§3)
        run: python scripts/validate_course.py courses/cybersecurity-101
      - name: Test
        run: |
          pip install pytest || true
          python -m pytest tests/ -q
